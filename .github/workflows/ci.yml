name: Validate application
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ecommerce_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d ecommerce_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      APP_ENV: test
      PROVIDER_MODE: mock
      DATABASE_URL: postgresql+psycopg://app:ci-only-password@localhost:5432/ecommerce_test
      TEST_DATABASE_URL: postgresql+psycopg://app:ci-only-password@localhost:5432/ecommerce_test
      FRONTEND_ORIGIN: http://localhost:3000
      BACKEND_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.lock
      - name: Backend validation
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
          mypy app
          alembic upgrade head
          pytest -q
      - run: npm ci
        working-directory: frontend
      - name: Frontend validation
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npx playwright install --with-deps chromium
      - name: Start isolated end-to-end database and applications
        run: |
          python -c "import psycopg; c=psycopg.connect('postgresql://app:ci-only-password@localhost:5432/postgres',autocommit=True); c.execute('CREATE DATABASE ecommerce_e2e')"
          export DATABASE_URL=postgresql+psycopg://app:ci-only-password@localhost:5432/ecommerce_e2e
          cd backend
          alembic upgrade head
          python -m scripts.seed_demo
          uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > /tmp/backend.log 2>&1 &
          cd ../frontend
          npm start > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/v1/health/ready && break || sleep 2; done
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-traces
          path: frontend/test-results
