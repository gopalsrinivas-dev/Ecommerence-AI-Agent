services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
      POSTGRES_DB: ecommerce
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U app -d ecommerce"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    build: ./backend
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD:-local-demo-only}@db:5432/ecommerce
      APP_ENV: ${APP_ENV:-development}
      LOG_FORMAT: ${LOG_FORMAT:-auto}
      PROVIDER_MODE: ${PROVIDER_MODE:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    command: [alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
  backend:
    build: ./backend
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 10
  seed:
    profiles: [tools]
    build: ./backend
    environment: *backend-env
    command: [python, -m, scripts.seed_demo]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres-data:
